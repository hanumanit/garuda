# Garuda configuration.
#
# Every key here reaches something. Unknown keys are a startup error rather than
# being silently ignored, so a typo cannot quietly disable what you asked for.

[model]
# Root for the L2 expert cache and the KV spill directory.
path = "./models"
# Path to a GGUF checkpoint. Leave empty to run the synthetic MoE (meaningless
# output). Set it to load a real model instead — the router/experts/top_k knobs are
# then ignored. F32/F16/Q4_0/Q8_0 and the k-quants Q2_K-Q6_K decode; MoE experts may
# be either the merged `..._exps` tensor layout or the older per-expert layout. A
# tiny real model to try:
#   curl -L https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf -o stories260K.gguf
# gguf = "stories260K.gguf"
gguf = ""
# Keep the checkpoint packed in a memory-mapped file and dequantise per row at
# inference, instead of expanding every weight to f32 in RAM. Uses roughly the file's
# on-disk size instead of several times more (e.g. ~0.6 GB vs ~4 GB for a 1.1B Q4_K_M
# model), at the cost of slower generation. Only affects gguf models.
mmap = false
# Gating strategy (synthetic MoE only): mixtral | deepseek | qwen
router = "mixtral"
# Context window, in tokens. A byte-level tokenizer means roughly one token per byte.
context = 4096
experts = 8
top_k = 2
# Attention window. 0 attends to the whole context.
sliding_window = 0
# Prompt tokens that share one pass over a layer's weights during prefill; 0 uses the
# built-in default, 1 turns batching off. Within a layer the batch is grouped by which
# expert each token routed to, so an expert's rows are decoded once for all of them.
# Measured ~2x faster on a 620 MB MoE model that fits entirely in RAM, and it also cuts
# the prefill working set from the whole model per token to a single layer, which is
# what makes a checkpoint larger than RAM usable. Raising it costs activation memory
# (chunk * d_model * 4 bytes) and nothing else.
prefill_batch = 0
# Tokens to guess ahead when a single request is decoding on its own. A guess is
# copied from earlier in the context and kept only where the model would have chosen
# it anyway, so the output never changes — what it saves is passes over the weights,
# which on a checkpoint larger than RAM is nearly the whole cost of a token. Greedy
# requests get back exactly what plain decoding gives; sampled ones get the same
# distribution, though at temperature 0.8 the guesses are rejected often enough that
# it buys nothing measurable. 0 disables it. The value is a ceiling: each sequence asks for a
# little more than its recent guesses have been winning, so a workload the guessing
# does not suit stops paying for it.
speculative_lookahead = 4
# There is no GPU backend. Setting this to true is a startup error, not a fallback.
gpu = false

[memory]
# L1 budget for expert weights. With the current dimensions an expert is ~384 KiB,
# so this holds all eight several times over.
expert_cache = "512MB"
# KV blocks held in RAM per sequence before older ones spill to disk. Spilling only
# pays off alongside model.sliding_window: full attention re-reads the whole prefix
# every token, so anything spilled is pulled straight back in. Set this high enough to
# cover the context (context / 32, rounded up) or set a window; Garuda warns at startup
# if the combination would spill and reload once per token.
kv_resident_blocks = 512
# Prompt prefixes to remember, so a repeated prompt skips prefill, and the RAM they
# may occupy between them. Both bound the cache; whichever binds first evicts.
#
# The byte budget is the one that matters. An entry holds a whole sequence's
# attention state, so what it costs depends on the model: a 2048-token prefix is
# ~0.1 MB on the synthetic engine and ~512 MB on Mixtral-8x7B. Sixty-four entries is
# nothing in the first case and 32 GB in the second.
prompt_cache_entries = 64
prompt_cache = "512MB"
# Cold archive tier. Empty disables L3.
archive_path = ""
kv_spill = true

[runtime]
# Compute threads. 0 uses every core.
threads = 0
prefetch = true
predictor = true

[server]
host = "127.0.0.1"
port = 8080
# Sequences decoding at once.
max_concurrent = 4
# Requests allowed to wait for a slot before the server sheds load with a 503.
queue_capacity = 256
# Concurrent requests one caller may have in flight. The caller is whoever the
# X-Garuda-User header names, on every protocol; callers who send nothing share one
# "anonymous" bucket, so raise this if your clients do not identify themselves.
max_concurrent_per_user = 8
request_timeout_secs = 120
# Permissive CORS. Off by default: unless api_keys is set below, this server has
# no authentication.
cors = false
# Keys accepted on every request except GET /health and GET /. Checked against
# `Authorization: Bearer <key>` (OpenAI/llama.cpp/Ollama clients) or
# `x-api-key: <key>` (Anthropic clients), whichever a caller sends. A WebSocket may
# also present one as the `garuda.api-key.<key>` subprotocol, since browsers cannot
# set headers on a handshake. Empty (the default) means no authentication at all — do
# not expose this port to a network you do not control unless this is set, e.g.:
#   api_keys = ["sk-change-me"]
api_keys = []

[sampling]
temperature = 0.8
top_p = 0.95
top_k = 40
max_tokens = 256
